  # About
  about:
    enable: true
    title: "About Me"
    content: |-
      I'm a tinkerer at heart with 15+ years of building software across wildly different domains: fintech, media, agritech, DeFi, telecom, bioinformatics. I get restless if I'm not pulling apart something new.

      My projects range from DeFi bots to voice-first AI tutors built on WebRTC, from automating government tender submissions with Claude to reconciling bank settlements across 38 African countries. The way I work is the same on every one: find out what the client actually cares about, including what nobody wrote down; ship something real in their domain in the first week; put tests and monitoring around it; write up every change so the next person understands why. I run [NARS Technical Services](https://www.narstechnical.co.ke) in Nairobi, where the rule is simple: if it's an interesting problem, we build it, and we stay on it after it ships.

      BSc Biochemistry & Molecular Biology, JKUAT (coursework at McGill, credits transferred). Publication: *Genomics and Potential Downstream Applications in the Developing World*. Swahili, English, French (working).
    skills:
      enable: true
      title: "Technologies I work with:"
      items:
        - "Flutter / FlutterFlow"
        - "React / Next.js"
        - "FastAPI / Python"
        - "TypeScript / JavaScript"
        - "LangGraph / Mastra"
        - "Claude API / OpenAI"
        - "LiveKit (WebRTC)"
        - "Deepgram / ElevenLabs"
        - "AWS / GCP / Docker"
        - "PostgreSQL"

  # Experience
  # ponytail: 3 roles x 2 bullets per audit F7 (2026-11-07); full history lives in /resume.html
  experience:
    enable: true
    items:
      - company: "NARS Technical Services"
        companyUrl: "https://www.narstechnical.co.ke"
        jobs:
          - name: "Chief Executive Officer"
            date: "Mar 2022 - Present"
            content: |
              Building AI-powered software and running telecom infrastructure deployments in Nairobi, Kenya.

              - Built Quizlar, a voice-first AI learning platform (LiveKit, LangGraph, Deepgram) that turns study material into real-time spoken quiz sessions with adaptive spaced repetition.
              - Automated bank settlement reconciliation across 38 African countries.

      - company: "TradePulse Inc."
        companyUrl: "#"
        jobs:
          - name: "Head of Mobile"
            date: "Jan 2024 - Aug 2025"
            content: |
              Led mobile and web platform development for agro-processing in Nairobi, Kenya.

              - Led end-to-end Flutter development of the TradePulse Mobile App, enabling agro-processors to manage inventory, create orders, accept payments, and generate reports.
              - Spearheaded React/Next.js development of the TradePulse Sourcing Platform, a CRM-driven B2B system that streamlined raw material sourcing between buyers and suppliers.

      - company: "Radio Africa Group"
        companyUrl: "#"
        jobs:
          - name: "Team Leader, Innovation"
            date: "May 2016 - Apr 2022"
            content: |
              Joined as a software engineer, then directed agile teams building consumer digital products reaching millions of users.

              - Built a music streaming platform with real-time recommendations.
              - Developed a digital newspaper platform enabling subscriptions and seamless content delivery.

              Earlier: payments at Cellulant, bioinformatics at IITA. [Full history in the CV](/resume.html).

  # Projects
  projects:
    enable: true
    items:
      - title: Quizlar, Voice-First AI Learning Platform
        image: /images/project-quizlar.svg
        content: Real-time voice quiz sessions with adaptive spaced repetition, built on LiveKit (WebRTC), LangGraph and Deepgram. Every tier is mine, from the FastAPI backend and React frontend to the Flutter client and an LLM agent layer with multi-provider failover and DSPy evals that catch grading regressions before users see them.
        badges:
          - "LiveKit"
          - "LangGraph"
          - "DSPy"
          - "FastAPI"
          - "Flutter"

      - title: Voice and Messaging Agent Platform
        image: /images/project-voice-agent.svg
        content: A multilingual conversational agent platform that answers inbound calls and messages on behalf of the business it is deployed into. Real-time speech over LiveKit, a LangGraph agent layer, a FastAPI service tier, a versioned Postgres schema and retrieval over a vector store. Built to drop into an operator's existing workflow rather than replace it.
        badges:
          - "LiveKit"
          - "LangGraph"
          - "FastAPI"
          - "PostgreSQL"
          - "Qdrant"

      - title: Document Extraction Pipeline
        image: /images/project-doc-extraction.svg
        content: Invoices, purchase orders, receipts and bank statements go in; structured, queryable records come out and sync into the customer's existing system of record. OCR and PDF parsing feed an LLM extraction layer, served from edge workers over serverless Postgres.
        badges:
          - "TypeScript"
          - "Cloudflare Workers"
          - "LangGraph"
          - "OCR"
          - "PostgreSQL"

      - title: Settlement Reconciliation Platform
        image: /images/project-settlement.svg
        content: A 15-stage pipeline that normalizes ten settlement formats, including M-PESA, MTN, Airtel, NIBSS, KEPSS, PAPSS, SWIFT MT940/MT103 and ISO 20022 camt.053, across 38 African countries.
        badges:
          - "FastAPI"
          - "React"
          - "LangGraph"
          - "Python"

      - title: AI Content Management Agent
        image: /images/project-content-agent.svg
        content: Autonomous system using Mastra and Claude to grade, optimize SEO/GEO, and curate 1,200+ blog posts for an electric vehicle publication focused on developing economies.
        badges:
          - "Mastra"
          - "Claude API"
          - "AI Agents"

      - title: Tender Document Automation
        image: /images/project-tender.svg
        content: Extracts fillable fields from complex government PDFs, auto-fills from company profiles, and generates multiple output formats. Used for real government tender submissions.
        badges:
          - "Python"
          - "PyMuPDF"
          - "Claude API"

      - title: eTIMS Integration Tooling
        image: /images/project-etims.svg
        content: Kenya Revenue Authority electronic tax invoice compliance integration covering 20+ API endpoints across device registration, invoicing, stock management, and item classification.
        badges:
          - "Python"
          - "REST APIs"
          - "KRA"

      - title: TradePulse Mobile App
        image: /images/project-tradepulse.svg
        content: Flutter app enabling agro-processors to manage inventory, create orders, accept payments and generate reports, paired with the Next.js sourcing platform the same buyers order through.
        badges:
          - "Flutter"
          - "Mobile"
          - "Fintech"

